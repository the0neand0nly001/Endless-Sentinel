services:
  endless-sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    image: endless-sentinel:1.0.0
    container_name: endless-sentinel
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${ENDLESS_SENTINEL_BIND:-0.0.0.0}:${ENDLESS_SENTINEL_PORT:-8080}:8080"
    volumes:
      - "${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock"
      - "${DOCKER_CERT_PATH_HOST:-/dev/null}:/config/docker-certs:ro"
      - "${K3S_KUBECONFIG_HOST:-/dev/null}:/config/kubeconfig:ro"
    group_add:
      - "${DOCKER_GID:-998}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
