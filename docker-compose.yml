services:
  endless-sentinel:
    build: .
    image: endless-sentinel:local
    container_name: endless-sentinel
    env_file: .env
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env:rw
      # Enable only when monitoring local Docker; socket access is root-equivalent.
      # - /var/run/docker.sock:/var/run/docker.sock:ro
      # Mount kubeconfig/certificates when enabled:
      # - /etc/rancher/k3s/k3s.yaml:/config/kubeconfig:ro
      # - ./certs:/certs:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
