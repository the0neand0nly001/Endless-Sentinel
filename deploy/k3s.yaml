apiVersion: v1
kind: ServiceAccount
metadata: {name: endless-sentinel}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: endless-sentinel-readonly}
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: endless-sentinel-readonly}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: endless-sentinel-readonly}
subjects: [{kind: ServiceAccount, name: endless-sentinel, namespace: default}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: endless-sentinel}
spec:
  replicas: 1
  selector: {matchLabels: {app: endless-sentinel}}
  template:
    metadata: {labels: {app: endless-sentinel}}
    spec:
      serviceAccountName: endless-sentinel
      containers:
        - name: app
          image: REPLACE_WITH_YOUR_IMAGE
          ports: [{containerPort: 8080}]
          envFrom: [{secretRef: {name: endless-sentinel-env}}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 15}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true}
---
apiVersion: v1
kind: Service
metadata: {name: endless-sentinel}
spec:
  selector: {app: endless-sentinel}
  ports: [{port: 80, targetPort: 8080}]
