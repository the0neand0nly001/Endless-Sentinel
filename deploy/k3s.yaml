apiVersion: v1
kind: Namespace
metadata:
  name: endless-sentinel
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: endless-sentinel
  namespace: endless-sentinel
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: endless-sentinel-readonly
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: endless-sentinel-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: endless-sentinel-readonly
subjects:
  - kind: ServiceAccount
    name: endless-sentinel
    namespace: endless-sentinel
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: endless-sentinel-config
  namespace: endless-sentinel
data:
  K3S_ENABLED: "true"
  K3S_IN_CLUSTER: "true"
  ENABLE_BACKGROUND_POLLER: "true"
  POLL_INTERVAL_SECONDS: "30"
  DASHBOARD_REFRESH_SECONDS: "10"
  SEND_RECOVERY_ALERTS: "true"
  LOG_LEVEL: "INFO"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: endless-sentinel
  namespace: endless-sentinel
  labels:
    app.kubernetes.io/name: endless-sentinel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: endless-sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: endless-sentinel
    spec:
      serviceAccountName: endless-sentinel
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: endless-sentinel
          image: endless-sentinel:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: endless-sentinel-config
            - secretRef:
                name: endless-sentinel-secrets
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: endless-sentinel
  namespace: endless-sentinel
spec:
  selector:
    app.kubernetes.io/name: endless-sentinel
  ports:
    - name: http
      port: 80
      targetPort: http
